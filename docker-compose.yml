services:
  postgres:
    image: postgres:16-alpine
    container_name: weitblick-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: weitblick
      POSTGRES_PASSWORD: weitblick
      POSTGRES_DB: weitblick
    ports:
      - '5433:5432'
    volumes:
      - weitblick-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U weitblick -d weitblick']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  weitblick-pgdata:
