
server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 25m;

  include /etc/nginx/conf.d/security-headers.conf;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  location ~ ^/(graphql|health|quotes|begleitbelege|invoices|appointments|attachments|export|public|legal|letterhead|oauth|mcp)(/|$) {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_read_timeout 120s;
    proxy_pass_header Content-Disposition;
  }

  location /billing/webhook {
    proxy_pass http://api:4000/billing/webhook;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_request_buffering off;
  }

  location /live {
    proxy_pass http://api:4000/live;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1200s;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/conf.d/security-headers.conf;
  }

  location = /index.html {
    add_header Cache-Control "no-store" always;
    include /etc/nginx/conf.d/security-headers.conf;
  }

  location = /version.json {
    add_header Cache-Control "no-store" always;
    include /etc/nginx/conf.d/security-headers.conf;
  }

  location /formular/ {
    add_header Cache-Control "no-store" always;
    include /etc/nginx/security-headers-einbettbar.conf;
    try_files /index.html =404;
  }

  location = / {
    add_header Cache-Control "no-store" always;
    include /etc/nginx/conf.d/security-headers.conf;
    try_files /start.html /index.html;
  }

  location ~ ^/(funktionen|entwickler|hilfe/fehlerbehebung)(/|$) {
    add_header Cache-Control "no-store" always;
    include /etc/nginx/conf.d/security-headers.conf;
    try_files $uri/index.html /index.html;
  }

  location / {
    try_files $uri /index.html;
  }
}
